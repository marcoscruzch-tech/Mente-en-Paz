<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and paths -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76daf2" />
      <stop offset="65%" stop-color="#42c2d2" />
      <stop offset="100%" stop-color="#21aab5" />
    </linearGradient>
    
    <!-- Skin Tone Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b4" />
      <stop offset="100%" stop-color="#fca87c" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3736" />
      <stop offset="100%" stop-color="#2c1e1e" />
    </linearGradient>

    <!-- Arc for top text MENTE EN PAZ -->
    <path id="textArc" d="M 115,170 A 165,165 0 0,1 397,170" fill="none" />
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Inner border shadow overlay -->
  <rect width="512" height="512" rx="110" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Background Halo (Concentric Circles as seen in the image) -->
  <circle cx="256" cy="245" r="115" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="10" />
  <circle cx="256" cy="245" r="105" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
  <circle cx="256" cy="245" r="125" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Sparkles in the sky matching the image position -->
  <!-- Left top small sparkle -->
  <path d="M 205,180 Q 205,185 200,185 Q 205,185 205,190 Q 205,185 210,185 Q 205,185 205,180" fill="rgba(255,255,255,0.75)" />
  <!-- Left middle large sparkle -->
  <path d="M 100,280 Q 100,290 90,290 Q 100,290 100,300 Q 100,290 110,290 Q 100,290 100,280" fill="rgba(255,255,255,0.8)" />
  <!-- Left background tiny dots -->
  <circle cx="104" cy="188" r="1.5" fill="rgba(255,255,255,0.6)" />
  <circle cx="108" cy="235" r="1.5" fill="rgba(255,255,255,0.6)" />
  <!-- Right middle large sparkle -->
  <path d="M 410,235 Q 410,243 402,243 Q 410,243 410,251 Q 410,243 418,243 Q 410,243 410,235" fill="rgba(255,255,255,0.8)" />
  <!-- Right lower small sparkle -->
  <path d="M 390,270 Q 390,274 386,274 Q 390,274 390,278 Q 390,274 394,274 Q 390,274 390,270" fill="rgba(255,255,255,0.7)" />

  <!-- 1. Peace Dove (Behind the girl, on the right side) -->
  <g transform="translate(45, 5)">
    <!-- Back Wing -->
    <path d="M 230,150 C 210,120 160,110 130,135 C 145,155 175,170 210,170 Z" fill="rgba(255,255,255,0.85)" />
    <!-- Main Dove Body -->
    <path d="M 215,225 C 240,225 300,210 320,180 C 322,175 320,170 315,170 C 285,175 250,155 235,180 C 225,195 210,205 190,200 C 180,195 180,180 190,175 C 220,150 255,170 270,140 C 255,145 235,140 220,150 C 190,170 170,200 175,220 C 178,225 195,225 215,225 Z" fill="#ffffff" />
    <!-- Front Wing (beautiful layered feathers) -->
    <path d="M 230,178 C 210,130 155,130 135,160 C 120,180 125,205 145,220 C 165,230 185,225 200,215 C 215,205 225,190 230,178 Z" fill="#f0fafb" />
    <!-- Tail -->
    <path d="M 315,170 C 335,150 355,150 360,165 C 345,175 325,180 315,170 Z" fill="#ffffff" />
    <!-- Beak -->
    <path d="M 320,180 L 332,176 L 321,173 Z" fill="#fca87c" />
    <!-- Eye -->
    <circle cx="308" cy="178" r="2" fill="#4a3736" />
    <!-- Olive Branch in Beak -->
    <g transform="translate(325, 172) rotate(-15)">
      <!-- Stem -->
      <path d="M 0,5 Q 15,0 30,-10" fill="none" stroke="#a07855" stroke-width="2" stroke-linecap="round" />
      <!-- Leaves -->
      <path d="M 8,3 C 7,-3 15,-5 16,0 C 17,5 9,7 8,3 Z" fill="#8cb85c" />
      <path d="M 18,0 C 18,-6 26,-6 26,-1 C 26,4 18,5 18,0 Z" fill="#7ba84c" />
      <path d="M 25,-5 C 26,-11 34,-9 33,-4 C 32,1 25,0 25,-5 Z" fill="#8cb85c" />
    </g>
  </g>

  <!-- 2. Grassy Hill at bottom -->
  <path d="M -20,380 Q 256,335 532,380 L 532,530 L -20,530 Z" fill="#1fa9b5" />
  <!-- Bottom Highlight wave -->
  <path d="M -20,380 Q 256,335 532,380 L 532,410 Q 256,365 -20,410 Z" fill="rgba(255, 255, 255, 0.08)" />

  <!-- Tiny green plants on the hill sides matching the image -->
  <g fill="#1fa9b5" opacity="0.9">
    <!-- Left Leaf Sprouts -->
    <path d="M 125,370 C 115,355 125,340 130,340 C 135,340 135,355 130,370 Z" />
    <path d="M 140,373 C 135,360 145,348 150,348 C 155,348 150,360 142,373 Z" />
    <path d="M 115,372 C 105,362 110,350 115,350 C 120,350 120,362 117,372 Z" />

    <!-- Right Leaf Sprouts -->
    <path d="M 387,370 C 397,355 387,340 382,340 C 377,340 377,355 382,370 Z" />
    <path d="M 372,373 C 377,360 367,348 362,348 C 357,348 362,360 370,373 Z" />
    <path d="M 397,372 C 407,362 402,350 397,350 C 392,350 392,362 395,372 Z" />
  </g>

  <!-- 3. Meditating Girl (Centered) -->
  <g transform="translate(0, 10)">
    <!-- Long Hair Backing (Frames head and shoulders organically) -->
    <path d="M 190,220 C 170,260 175,320 205,330 C 220,335 292,335 307,330 C 337,320 342,260 322,220 C 322,220 335,160 256,160 C 177,160 190,220 190,220 Z" fill="url(#hairGrad)" />

    <!-- Legs in Lotus Position (Teal pants) -->
    <path d="M 172,335 C 172,320 200,310 256,310 C 312,310 340,320 340,335 C 340,355 315,360 256,360 C 197,360 172,355 172,335 Z" fill="#248a9b" />
    <!-- Knees highlights -->
    <path d="M 175,335 C 175,327 195,323 205,332 C 195,338 180,340 175,335 Z" fill="#2e9eb0" />
    <path d="M 337,335 C 337,327 317,323 307,332 C 317,338 332,340 337,335 Z" fill="#2e9eb0" />
    <!-- Folded legs highlights inside -->
    <path d="M 205,338 Q 235,355 256,342 Q 277,355 307,338" fill="none" stroke="#1c7585" stroke-width="3" stroke-linecap="round" />

    <!-- Bare Neck and Shoulders (Beautiful soft organic shape) -->
    <path d="M 235,245 L 277,245 L 285,315 L 227,315 Z" fill="url(#skinGrad)" />
    
    <!-- Yellow Sleeveless / sweetheart neckline top -->
    <path d="M 224,272 C 224,258 288,258 288,272 L 288,315 L 224,315 Z" fill="#f3be4d" />
    
    <!-- Large beautiful cream-white heart details on Top -->
    <path d="M 256,268 C 256,268 234,244 234,265 C 234,286 256,304 256,304 C 256,304 278,286 278,265 C 278,244 256,268 256,268 Z" fill="#fff5d0" />
    <!-- Smaller golden-orange heart in center of white heart -->
    <path d="M 256,274 C 256,274 242,258 242,272 C 242,286 256,298 256,298 C 256,298 270,286 270,272 C 270,258 256,274 256,274 Z" fill="#f2a83c" />

    <!-- Head & Face -->
    <path d="M 220,205 C 220,175 292,175 292,205 C 292,235 220,235 220,205 Z" fill="url(#skinGrad)" />
    
    <!-- Cheeks (Soft blush as seen in image) -->
    <circle cx="233" cy="216" r="7" fill="#fca87c" opacity="0.5" />
    <circle cx="279" cy="216" r="7" fill="#fca87c" opacity="0.5" />

    <!-- Closed Eyes (Serene curved lines curving upwards like ⌒) -->
    <path d="M 233,212 Q 240,204 247,212" fill="none" stroke="#4a3736" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 265,212 Q 272,204 279,212" fill="none" stroke="#4a3736" stroke-width="2.8" stroke-linecap="round" />

    <!-- Smile -->
    <path d="M 250,220 Q 256,224 262,220" fill="none" stroke="#4a3736" stroke-width="2.2" stroke-linecap="round" />

    <!-- Hair Front (Bangs with beautiful sweep parting) -->
    <path d="M 218,205 C 218,205 235,182 256,182 C 277,182 294,205 294,205 C 300,215 298,235 292,245 C 292,245 286,215 278,210 C 268,204 258,208 252,212 C 246,208 238,204 230,210 C 222,215 218,245 218,245 C 218,245 214,215 218,205 Z" fill="url(#hairGrad)" />

    <!-- Beautiful Cloped/Praying Hands & Bare Arms matching the image exactly -->
    <path d="M 220,265 C 215,290 235,310 252,301 C 254,300 254,295 252,294 L 252,282" fill="none" stroke="url(#skinGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 292,265 C 297,290 277,310 260,301 C 258,300 258,295 260,294 L 260,282" fill="none" stroke="url(#skinGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Praying fingers joined overlay in front of heart -->
    <path d="M 251,294 C 251,278 256,268 256,268 C 256,268 261,278 261,294 Z" fill="url(#skinGrad)" />
    <!-- Small shadow overlay to separate thumbs -->
    <path d="M 256,268 L 256,294" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1" />
  </g>

  <!-- 4. Top Curved Text: MENTE EN PAZ (Elegant layout) -->
  <use href="#textArc" fill="none" stroke="none" />
  <text fill="#ffffff" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" letter-spacing="4" text-anchor="middle">
    <textPath href="#textArc" startOffset="50%">MENTE EN PAZ</textPath>
  </text>

  <!-- 5. Bottom Text and Number (Centered & styled with flourish) -->
  <!-- The Big White "60" centered at x=245 -->
  <text x="245" y="440" fill="#ffffff" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="82" font-weight="800" text-anchor="middle">60</text>
  
  <!-- Elegant flourish/swirl to the right of "60" matching image exactly -->
  <g transform="translate(300, 395) scale(0.85)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M 5,25 C 20,25 35,5 45,20 C 50,27 45,35 37,32 C 25,27 28,15 38,18 C 45,20 48,26 42,28" />
    <circle cx="42" cy="28" r="1.5" fill="#ffffff" />
    <path d="M 12,32 C 22,35 30,30 35,32" />
  </g>

  <!-- Subtitle: PENSAMIENTOS DE PERDON -->
  <text x="256" y="475" fill="#ffffff" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="2" text-anchor="middle" opacity="0.95">PENSAMIENTOS DE PERDON</text>
</svg>
